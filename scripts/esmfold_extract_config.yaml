# Configuration for scripts/run_esmfold_extract.py
#
# Runs ESMFold v1 hidden-representation extraction over a directory of
# sequences.  Input layout — either of:
#
#     <sequences_dir>/          (flat or nested .fasta / .fa / .faa files)
#       seq_001.fasta
#       seq_002.fasta
#
#     <sequences_dir>/          (same structure Boltz uses — yamls ignored,
#       seq_001/                 fastas extracted from subdirs)
#         seq_001.yaml
#         seq_001.fasta
#
# Each FASTA is symlinked into a per-GPU chunk directory and one
# extract_hidden_reps_esmfold subprocess is launched per GPU.

input:
  # Directory containing FASTA files (discovered via rglob '*.fasta').
  sequences_dir: /n/holylfs06/LABS/bsabatini_lab/Everyone/tbush/protein_rsa/original

  # Optional: only process FASTAs whose stem matches a line in this file.
  subset_file: null

output:
  # Where per-record outputs will be written (one subdir per record_id).
  out_dir: /n/holylfs06/LABS/bsabatini_lab/Everyone/tbush/protein_rsa/original/hidden_reps/esmfold


  # Staging directory for symlink chunks. Defaults to <out_dir>/_staging.
  staging_dir: null

# ESMFold model parameters.
model:
  # HuggingFace model id — always "facebook/esmfold_v1".
  name: facebook/esmfold_v1
  # HF cache root. The model is loaded from <cache_dir>/hub/ with local_files_only=True.
  # Same pattern as ProtForge's run_esmfold.py --cache_dir.
  cache_dir: /n/holylfs06/LABS/bsabatini_lab/Everyone/esm_models_cache
  num_recycles: 4
  # Trunk chunk size for axial attention. Lower = less VRAM, slower.
  # Set to -1 to disable chunking entirely.
  chunk_size: 64
  # Cast ESM2 backbone + trunk to float16 (saves ~50% VRAM).
  fp16: false

# Which hidden representations to capture.
#
#   sites       — top-level sites: list of names, or "all"
#   trunk_layers — folding trunk block indices: list of ints, or "all" (48 blocks)
#   esm_layers  — ESM2 encoder layer indices: list of ints, or "all" (36 layers)
#   layer_sites — per-layer sites: list of names, or "all"
#   recycling_steps_to_save — "last": final step only (default)
#                            "all": every step
#                            "every:N": every Nth step
#                            comma-separated indices, e.g. "0,2" or "-1"
#
# Valid `sites` (see ESMFoldExtractor.SITES):
#   esm_s_combined  — combined ESM2 hidden states entering the trunk
#   trunk_s         — final trunk sequence state   (B, L, 1024)
#   trunk_z         — final trunk pair state        (B, L, L, 128)
#   structure_out   — structure module output dict
#   distogram       — distogram logits              (B, L, L, 64)
#   lddt_logits     — pLDDT head logits             (B, L, 50)
#   ptm_logits      — pTM head logits
#   positions       — atom coordinates (from model output, not hook)
#
# Valid `layer_sites` (see ESMFoldExtractor.LAYER_SITES):
#   layer_s, layer_z            — per-trunk-block sequence/pair output
#   seq_attention                — sequence self-attention output
#   tri_mul_out, tri_mul_in      — triangle multiplication modules
#   tri_att_start, tri_att_end   — triangle attention modules
#   transition_s, transition_z   — MLP transition outputs
#   esm_layer                    — ESM2 backbone per-layer hidden state
#   esm_attention_out            — ESM2 attention sublayer output
#   esm_attention_weights        — ESM2 post-softmax attention (B,40,L,L) — monkey-patched
#   esm_ffn_out                  — ESM2 FFN sublayer output
extraction:
  sites: []
  trunk_layers: [0, 11, 23, 35, 47]
  esm_layers: []
  layer_sites: [tri_att_start, tri_att_end, layer_z]
  # NOTE: esm_s_combined and esm_layer fire once before recycling and land
  # in step 0.  With "last", only the final recycling step is saved — those
  # sites won't be in the output.  Use "all" or "0,-1" to capture them.
  recycling_steps_to_save: "0,-1"

# Runtime / parallelism settings.
runtime:
  num_gpus: 1
  accelerator: gpu         # gpu | cpu
  python: python           # interpreter for subprocesses
  max_length: null          # skip sequences longer than this (memory safety)
  # Optional extra env vars injected into every subprocess.
  env: {}
