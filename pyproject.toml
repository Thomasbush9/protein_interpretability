[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-interpretability"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bio>=1.8.1",
    "biopython>=1.87",
    "ipykernel>=7.2.0",
    "ipython>=9.12.0",
    "matplotlib>=3.10.8",
    "matplotlib-inline>=0.2.1",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tmtools>=0.3.0",
]
# torch is deliberately NOT here. The only file that imports it is pi_core, for
# a checkpoint load, and that runs inside the mosaic container which supplies
# its own. Declaring it made the analysis environment 5 GB -- enough that a cold
# `import pytest` off this filesystem took 40 s and read as a hung test runner.
# The plan asks that offline analysis install without model-specific
# environments; this is most of what that meant in practice.

[project.scripts]
pi = "protein_interpretability.cli.main:main"

[project.optional-dependencies]
esm = [
    "esm",
    "huggingface_hub",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
notebook = [
    "marimo>=0.24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
