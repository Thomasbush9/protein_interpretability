[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-interpretability"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.87",
    "ipykernel>=7.2.0",
    "ipython>=9.12.0",
    "matplotlib>=3.10.8",
    "matplotlib-inline>=0.2.1",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tmtools>=0.3.0",
    "torch>=2.11.0",
]

[project.optional-dependencies]
esm = [
    "esm",
    "huggingface_hub",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
